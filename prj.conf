# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# GPIO for LED debugging
CONFIG_GPIO=y

# Console and Logging via UART
# NOTE: ESP32-S2 does not have USB CDC support in Zephyr yet.
# Console output requires external USB-to-UART adapter connected to:
#   GPIO43 (DB pin) = UART0 TX - connects to ESP-Prog TXD0 (pin 3)
#   GPIO44 = UART0 RX - connects to ESP-Prog RXD0 (pin 5)
# IMPORTANT: GPIO1/GPIO2 are BUTTONS on Reverse board, NOT UART!
# The USB-C port only provides power and flashing.
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Display Support
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# Power Management - DISABLED
# Testing showed that PM subsystem causes boot crashes on this board.
# We use manual GPIO control for display power (GPIO7) and backlight (GPIO45).
# This is a known limitation - the power domain subsystem doesn't work
# reliably with the ESP32-S2 HAL in Zephyr 4.2.
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
# CONFIG_PM_DEVICE_RUNTIME=y
# CONFIG_POWER_DOMAIN=y
# CONFIG_POWER_DOMAIN_GPIO=y

# LVGL Graphics Library (disabled for hardware test)
# CONFIG_LVGL=y
# CONFIG_LV_Z_MEM_POOL_SIZE=16384
# CONFIG_LV_COLOR_DEPTH_16=y
# CONFIG_LV_FONT_MONTSERRAT_16=y
# CONFIG_LV_FONT_MONTSERRAT_32=y

# Heap for LVGL and dynamic allocation
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Main stack size
CONFIG_MAIN_STACK_SIZE=4096

# System clock and timing
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
