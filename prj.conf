# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# GPIO for LED debugging
CONFIG_GPIO=y

# I2C bus for sensors
CONFIG_I2C=y

# Expose the I2C0 per-device pinctrl config to the application so
# sensors_read() can re-apply PINCTRL_STATE_DEFAULT after temporarily
# overriding SDA/SCL as plain GPIO outputs driven LOW (to block
# BME280 ESD-diode backfeed while its Vcc rail is cut). The DEFAULT
# reapply re-muxes the pads back to the I2C peripheral with pull-ups.
# PINCTRL_DYNAMIC selects the underlying PINCTRL_NON_STATIC symbol
# that PINCTRL_DT_DEV_CONFIG_DECLARE/_GET need (it has no user prompt).
CONFIG_PINCTRL_DYNAMIC=y

# Sensor subsystem
CONFIG_SENSOR=y
CONFIG_BME280=y

# BME280 weather-station preset (per Bosch datasheet §3.5.1):
# forced one-shot mode with 1x oversampling on all channels and the
# IIR filter off. The default normal mode self-clocks at 1 Hz with
# heavy oversampling, which heats the die enough to bias temperature
# readings up by 1-2 deg C. Forced mode lets the chip sleep between
# our minute-spaced reads.
CONFIG_BME280_MODE_FORCED=y
CONFIG_BME280_TEMP_OVER_1X=y
CONFIG_BME280_PRESS_OVER_1X=y
CONFIG_BME280_HUMIDITY_OVER_1X=y
CONFIG_BME280_FILTER_OFF=y

# Console and Logging via UART
# NOTE: ESP32-S2 does not have USB CDC support in Zephyr yet.
# Console output requires external USB-to-UART adapter connected to:
#   GPIO43 (DB pin) = UART0 TX - connects to ESP-Prog TXD0 (pin 3)
#   GPIO44 = UART0 RX - connects to ESP-Prog RXD0 (pin 5)
# IMPORTANT: GPIO1/GPIO2 are BUTTONS on Reverse board, NOT UART!
# The USB-C port only provides power and flashing.
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Float formatting for sensor values (required for printf/snprintf with %f)
CONFIG_PICOLIBC_IO_FLOAT=y

# Display Support
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# Power Management - DISABLED
# Testing showed that PM subsystem causes boot crashes on this board.
# We use manual GPIO control for display power (GPIO7) and backlight (GPIO45).
# This is a known limitation - the power domain subsystem doesn't work
# reliably with the ESP32-S2 HAL in Zephyr 4.2.
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
# CONFIG_PM_DEVICE_RUNTIME=y
# CONFIG_POWER_DOMAIN=y
# CONFIG_POWER_DOMAIN_GPIO=y

# CPU clock — overridden via DT in this app's board overlay (see
# boards/adafruit_feather_esp32s2_tft_reverse.overlay /cpus/cpu@0
# clock-frequency property). Drops from upstream's 240 MHz to 160 MHz
# to cut active-current draw. The app is I/O-bound — BME280 I2C, single-
# line LVGL repaint, brief HTTP POST — and CPU-bound time per minute
# is well under a second, so the wall-clock cost is invisible.
# 160 MHz is one of the four values the Zephyr-side esp32 module
# Kconfig recognizes (96 / 120 / 160 / 240); we stay inside that set.

# Input subsystem for button handling (D0/D1/D2)
# Use threaded mode (default) — synchronous mode runs callbacks in the
# gpio-keys workqueue context, which has insufficient stack for calling
# WiFi/net_mgmt APIs.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Fuel gauge for battery monitoring
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y

# LVGL Graphics Library
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_32=y

# Heap for LVGL, WiFi stack, and dynamic allocation.
# WiFi + networking stack requires ~55 KB; bumped from 32 KB to match
# Zephyr's auto-calculated minimum (and quiet the CMake warning).
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Main stack size
CONFIG_MAIN_STACK_SIZE=8192

# WiFi
# We switch at runtime between STA (normal operation) and AP (provisioning).
# On ESP32-S2 (single radio) the APSTA hybrid mode doesn't broadcast the AP
# beacon reliably, so we DON'T enable CONFIG_ESP32_WIFI_AP_STA_MODE. Instead
# the driver uses pure AP mode during provisioning and switches back to STA
# afterwards.
CONFIG_WIFI=y
CONFIG_NETWORKING=y

# DHCP server for SoftAP clients (Step 6)
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4

# BSD sockets for the provisioning HTTP server
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# SNTP for periodic wall-clock sync after WiFi connects.
# DNS lets sntp_simple() resolve "pool.ntp.org" directly.
CONFIG_NET_UDP=y
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y

# NVS for WiFi credential persistence (Step 2)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# System clock and timing
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# sys_reboot() — used after saving WiFi credentials via SoftAP provisioning
# so the new credentials take effect on a clean cold boot rather than via
# a fragile runtime AP→STA mode transition.
CONFIG_REBOOT=y
