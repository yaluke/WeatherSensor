# Minimal config for I2C diagnostic

# C++ support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# GPIO (for I2C power enable on GPIO7)
CONFIG_GPIO=y

# I2C
CONFIG_I2C=y

# Console/logging via UART0 (GPIO43/44 via ESP-Prog)
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y
